# EDBP Bluetooth denial policy.
#
# "blacklist" suppresses device-alias autoloading. The install rules also make
# explicit modprobe requests fail on Debian 13. Bluetooth is additionally
# denied on the Live and Installer kernel command lines in auto/config.

blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btintel
blacklist btbcm
blacklist btmtk
blacklist hci_uart
blacklist bnep
blacklist rfcomm
blacklist hidp

install bluetooth /bin/false
install btusb /bin/false
install hci_uart /bin/false
