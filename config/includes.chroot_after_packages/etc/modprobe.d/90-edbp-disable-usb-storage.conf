# EDBP USB mass-storage denial policy.
#
# Both drivers must be blocked: a UAS-capable device can otherwise fall back to
# usb_storage. Do not add either module to auto/config's Live kernel command
# line: the hybrid ISO must remain bootable when written to USB media.
# The installed-system initramfs enforcement is handled by the installer layer.

blacklist usb_storage
blacklist uas

install usb_storage /bin/false
install uas /bin/false
