# Managed by EDBP. Remote administration is public-key-only and limited to the
# break-glass local administrator. Console password authentication remains
# available through PAM/sudo; these directives affect SSH only.
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

AllowUsers localadmin
MaxAuthTries 3
LoginGraceTime 30
LogLevel VERBOSE
UseDNS no

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no

ClientAliveInterval 300
ClientAliveCountMax 2
