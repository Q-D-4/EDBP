# Deny every device exposing at least one Mass Storage interface. Keep this
# explicit rule before all allow rules so composite HID+storage and
# printer+storage devices fail closed.
#
#   08 = Mass Storage (including devices normally handled through UAS)
block with-interface one-of { 08:*:* }

# Permit a device only when its complete interface set is a subset of the
# approved classes.
#
#   03 = HID (keyboard/mouse)
#   06 = Still Imaging
#   07 = Printer
allow with-interface match-all { 03:*:* 06:*:* 07:*:* }

# Every other device is handled by ImplicitPolicyTarget=block.
